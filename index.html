<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>FinanceFlow v8.4</title>
    <style>
        .future-row { background-color: rgba(99, 102, 241, 0.04); border-left: 4px solid #6366f1; }
        .savings-row { background-color: rgba(240, 249, 255, 0.4); }
        .modal { transition: opacity 0.2s ease; visibility: hidden; opacity: 0; position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal.active { visibility: visible; opacity: 1; }
        body.modal-active { overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e2e8f0; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        .calendar-day { background-color: white; min-height: 60px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .calendar-header { background-color: #f8fafc; text-align: center; padding: 6px 0; font-size: 11px; font-weight: 900; text-transform: uppercase; color: #94a3b8; }
        .day-label { font-size: 13px; font-weight: 700; color: #64748b; margin-bottom: 2px; }
        .cal-income { color: #10b981; font-size: 11px; font-weight: 800; }
        .cal-expense { color: #ef4444; font-size: 11px; font-weight: 800; }
        .not-current-month { background-color: #f8fafc; opacity: 0.5; }
        .weekend { background-color: #f3f4f6; }
        .today-border { border: 2px solid #3b82f6 !important; border-radius: 4px; }

        @media (max-width: 380px) {
            .calendar-day { min-height: 52px; }
            .day-label { font-size: 11px; }
            .cal-income, .cal-expense { font-size: 9px; }
        }
    </style>
</head>
<body class="bg-slate-50 p-3 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Finance<span class="text-indigo-600">Flow</span></h1>
                <p id="header-date" class="text-indigo-500 font-bold text-sm uppercase tracking-widest"></p>
            </div>
        </header>

        <!-- Metric Top Bar -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div class="text-center">
                    <p class="text-[8px] font-black text-emerald-600 uppercase">Liquid Net (Total)</p>
                    <h2 id="net-today" class="text-base md:text-xl font-black text-emerald-800">$0</h2>
                </div>
                <div class="border-t border-slate-100 mt-2 pt-1 flex justify-around text-[10px] font-bold text-slate-500">
                    <div>M: <span id="net-mathias" class="text-slate-800 font-black">$0</span></div>
                    <div>J: <span id="net-julia" class="text-slate-800 font-black">$0</span></div>
                </div>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 text-center">
                <p class="text-[8px] font-black text-sky-600 uppercase">Savings Pool</p>
                <h2 id="savings-pool" class="text-base md:text-xl font-black text-sky-600">$0</h2>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 text-center">
                <p class="text-[8px] font-black text-red-600 uppercase">Future Flow</p>
                <h2 id="future-total" class="text-base md:text-xl font-black text-red-600">$0</h2>
            </div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 text-center">
                <p class="text-[8px] font-black text-slate-600 uppercase">Prognosis</p>
                <h2 id="prognosis" class="text-base md:text-xl font-black text-slate-600">$0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Sidebar Form Container -->
            <div class="lg:col-span-1">
                <div class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100 sticky top-4">
                    <h3 class="font-bold text-base mb-4 text-slate-800">New Entry</h3>
                    <div class="space-y-3">
                        <input id="date" type="date" class="w-full border-slate-200 border p-2.5 rounded-xl text-sm outline-none">
                        <input id="desc" type="text" placeholder="Description" class="w-full border-slate-200 border p-2.5 rounded-xl text-sm outline-none">
                        <input id="amount" type="number" placeholder="0.00" class="w-full border-slate-200 border p-2.5 rounded-xl text-sm font-bold outline-none">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <select id="type" class="border-slate-200 border p-2.5 rounded-xl text-sm bg-slate-50 font-semibold">
                                <option value="income">Income (+)</option>
                                <option value="expense">Expense (-)</option>
                            </select>
                            <select id="label_select" class="border-slate-200 border p-2.5 rounded-xl text-sm bg-slate-50 font-semibold"></select>
                        </div>

                        <div>
                            <label class="block text-[8px] font-black uppercase text-slate-400 mb-1 pl-1">Wallet Owner</label>
                            <select id="owner_select" class="w-full border-slate-200 border p-2.5 rounded-xl text-sm bg-slate-50 font-bold text-slate-700 outline-none">
                                <option value="Mathias">Mathias</option>
                                <option value="Julia">Julia</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-2 p-2 bg-slate-50 rounded-xl">
                            <input id="is_savings" type="checkbox" class="w-4 h-4 accent-sky-500">
                            <label for="is_savings" class="text-[9px] font-black text-slate-500 uppercase">Mark as Savings</label>
                        </div>
                        <button onclick="addTransaction()" class="w-full bg-slate-900 text-white font-black py-3 rounded-xl hover:bg-black shadow-lg text-sm">Save Entry</button>
                    </div>
                </div>
            </div>

            <!-- Content Container -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Liquid Trend Container -->
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-4 gap-2">
                        <h3 class="font-bold text-slate-700 text-[10px] uppercase tracking-widest">Liquid Trend</h3>
                        <div class="flex items-center gap-2 text-[10px] font-black">
                            <span class="text-slate-400 uppercase">Start:</span>
                            <input id="trendStart" type="date" onchange="calculateStats()" class="bg-slate-50 border-none rounded-lg p-1 outline-none font-bold">
                            <span class="text-slate-400 uppercase">End:</span>
                            <input id="trendEnd" type="date" onchange="calculateStats()" class="bg-slate-50 border-none rounded-lg p-1 outline-none font-bold">
                        </div>
                    </div>
                    <div class="h-48 md:h-64"><canvas id="lineChart"></canvas></div>
                </div>

                <!-- Savings Trend Container -->
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-4 gap-2">
                        <h3 class="font-bold text-sky-600 text-[10px] uppercase tracking-widest">Savings Trend</h3>
                        <div class="flex items-center gap-2 text-[10px] font-black">
                            <span class="text-slate-400 uppercase">Start:</span>
                            <input id="savingsStart" type="date" onchange="calculateStats()" class="bg-slate-50 border-none rounded-lg p-1 outline-none font-bold">
                            <span class="text-slate-400 uppercase">End:</span>
                            <input id="savingsEnd" type="date" onchange="calculateStats()" class="bg-slate-50 border-none rounded-lg p-1 outline-none font-bold">
                        </div>
                    </div>
                    <div class="h-48 md:h-64"><canvas id="savingsChart"></canvas></div>
                </div>

                <!-- Calendar Section -->
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-full font-bold text-slate-400">←</button>
                        <h3 id="calendar-month-name" class="font-black text-slate-800 text-[11px] uppercase tracking-tighter"></h3>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-full font-bold text-slate-400">→</button>
                    </div>
                    <div class="calendar-grid" id="calendar-body">
                        <div class="calendar-header">S</div><div class="calendar-header">M</div><div class="calendar-header">T</div>
                        <div class="calendar-header">W</div><div class="calendar-header">T</div><div class="calendar-header">F</div><div class="calendar-header">S</div>
                    </div>
                </div>

                <!-- Expense Lookup Tool -->
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 text-[10px] uppercase tracking-widest mb-4">Label Expense Lookup</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                        <div>
                            <label class="block text-[9px] font-black uppercase text-slate-400 mb-1">Select Label</label>
                            <select id="lookupLabel" onchange="calculateLabelExpense()" class="w-full border-slate-200 border p-2 rounded-xl text-sm bg-slate-50 font-semibold outline-none"></select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-black uppercase text-slate-400 mb-1">Timeframe</label>
                            <select id="lookupTimeframe" onchange="calculateLabelExpense()" class="w-full border-slate-200 border p-2 rounded-xl text-sm bg-slate-50 font-semibold outline-none">
                                <option value="all">All Time</option>
                                <option value="this-month">This Month</option>
                                <option value="last-30">Last 30 Days</option>
                                <option value="last-90">Last 90 Days</option>
                                <option value="this-year">This Year</option>
                            </select>
                        </div>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-4 text-center border border-slate-100">
                        <p class="text-[9px] font-black text-slate-500 uppercase tracking-wider">Total Expenses</p>
                        <h4 id="lookupResult" class="text-2xl font-black text-rose-600 mt-1">$0.00</h4>
                    </div>
                </div>

                <!-- Ledger History Table -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <h3 class="font-bold text-slate-800 text-xs uppercase">History</h3>
                        
                        <!-- History Filters Context Strip -->
                        <div class="flex flex-wrap items-center gap-2 text-[10px] font-black w-full sm:w-auto">
                            <select id="history_label_filter" onchange="renderFilteredHistory()" class="bg-slate-50 border border-slate-100 rounded-lg p-1 text-slate-700 outline-none">
                                <option value="all">All Labels</option>
                            </select>
                            <span class="text-slate-400 uppercase ml-1">From:</span>
                            <input id="historyStart" type="date" onchange="renderFilteredHistory()" class="bg-slate-50 border border-slate-100 rounded-lg p-1 outline-none text-slate-700">
                            <span class="text-slate-400 uppercase">To:</span>
                            <input id="historyEnd" type="date" onchange="renderFilteredHistory()" class="bg-slate-50 border border-slate-100 rounded-lg p-1 outline-none text-slate-700">
                        </div>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left min-w-[500px]">
                            <tbody id="history-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal Overlay -->
    <div id="editModal" class="modal">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Edit Entry</h3>
            <div class="space-y-4">
                <input id="edit_id" type="hidden"><input id="edit_date" type="date" class="w-full border p-3 rounded-xl outline-none">
                <input id="edit_desc" type="text" class="w-full border p-3 rounded-xl outline-none"><input id="edit_amount" type="number" class="w-full border p-3 rounded-xl outline-none font-bold">
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="edit_type" class="border p-3 rounded-xl bg-slate-50"><option value="income">Income</option><option value="expense">Expense</option></select>
                    <select id="edit_label" class="border p-3 rounded-xl bg-slate-50"></select>
                </div>

                <div>
                    <label class="block text-[8px] font-black uppercase text-slate-400 mb-1 pl-1">Wallet Owner</label>
                    <select id="edit_owner" class="w-full border p-3 rounded-xl bg-slate-50 font-bold text-slate-700 outline-none">
                        <option value="Mathias">Mathias</option>
                        <option value="Julia">Julia</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 p-2 bg-slate-50 rounded-xl"><input id="edit_savings" type="checkbox" class="w-5 h-5"><label class="text-[10px] font-black uppercase text-slate-500">Savings</label></div>
                <div class="flex gap-2 pt-4">
                    <button onclick="closeEditModal()" class="flex-1 py-3 font-bold text-slate-400">Cancel</button>
                    <button onclick="saveEdit()" class="flex-1 py-3 bg-indigo-600 text-white font-black rounded-xl shadow-lg">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://fgvppxrvheukkhnhyfim.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZndnBweHJ2aGV1a2tobmh5ZmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTUyNDgsImV4cCI6MjA5NDE3MTI0OH0.d4gsgx9bp79pVUw6yp65yyfpBWBmq-w_RICsJ6-S-Tw';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let lineChart;
        let savingsChart;
        let globalTransactionsCache = []; 
        let currentViewDate = new Date();
        document.getElementById('header-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('date').valueAsDate = new Date();

        function parseLocal(str) {
            const parts = str.split('T')[0].split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        async function init() {
            const { data: labels } = await supabaseClient.from('labels').select('*').order('name');
            const labelOptions = labels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            document.getElementById('label_select').innerHTML = labelOptions;
            document.getElementById('edit_label').innerHTML = labelOptions;
            document.getElementById('lookupLabel').innerHTML = labelOptions;
            
            // Populate the history label filtration dropdown option stack
            document.getElementById('history_label_filter').innerHTML = '<option value="all">All Labels</option>' + labelOptions;
            
            calculateStats();
        }

        async function addTransaction() {
            const payload = {
                description: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                label_id: document.getElementById('label_select').value,
                owner: document.getElementById('owner_select').value,
                is_savings: document.getElementById('is_savings').checked,
                created_at: new Date(document.getElementById('date').value).toISOString()
            };
            await supabaseClient.from('transactions').insert([payload]);
            document.getElementById('desc').value = ''; document.getElementById('amount').value = '';
            init();
        }

        async function confirmTransaction(id) {
            await supabaseClient.from('transactions').update({ created_at: new Date().toISOString() }).eq('id', id);
            calculateStats();
        }

        function changeMonth(dir) {
            currentViewDate.setMonth(currentViewDate.getMonth() + dir);
            calculateStats();
        }

        async function openEditModal(id) {
            const { data: t } = await supabaseClient.from('transactions').select('*').eq('id', id).single();
            document.getElementById('edit_id').value = t.id;
            document.getElementById('edit_date').value = t.created_at.split('T')[0];
            document.getElementById('edit_desc').value = t.description;
            document.getElementById('edit_amount').value = t.amount;
            document.getElementById('edit_type').value = t.type;
            document.getElementById('edit_label').value = t.label_id;
            document.getElementById('edit_owner').value = t.owner || 'Mathias';
            document.getElementById('edit_savings').checked = t.is_savings;
            document.getElementById('editModal').classList.add('active');
            document.body.classList.add('modal-active');
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); document.body.classList.remove('modal-active'); }

        async function saveEdit() {
            const id = document.getElementById('edit_id').value;
            const payload = {
                description: document.getElementById('edit_desc').value, amount: parseFloat(document.getElementById('edit_amount').value),
                type: document.getElementById('edit_type').value, label_id: document.getElementById('edit_label').value,
                owner: document.getElementById('edit_owner').value,
                is_savings: document.getElementById('edit_savings').checked, created_at: new Date(document.getElementById('edit_date').value).toISOString()
            };
            await supabaseClient.from('transactions').update(payload).eq('id', id);
            closeEditModal(); calculateStats();
        }

        function calculateLabelExpense() {
            const targetLabelId = document.getElementById('lookupLabel').value;
            const timeframe = document.getElementById('lookupTimeframe').value;
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            let total = 0;

            globalTransactionsCache.forEach(t => {
                if (t.type !== 'expense' || String(t.label_id) !== String(targetLabelId)) return;
                const tDate = parseLocal(t.created_at);
                let passTimeframe = false;

                if (timeframe === 'all') {
                    passTimeframe = true;
                } else if (timeframe === 'this-month') {
                    passTimeframe = (tDate.getMonth() === today.getMonth() && tDate.getFullYear() === today.getFullYear());
                } else if (timeframe === 'last-30') {
                    const diffTime = Math.abs(today - tDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    passTimeframe = (diffDays <= 30 && tDate <= today);
                } else if (timeframe === 'last-90') {
                    const diffTime = Math.abs(today - tDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    passTimeframe = (diffDays <= 90 && tDate <= today);
                } else if (timeframe === 'this-year') {
                    passTimeframe = (tDate.getFullYear() === today.getFullYear());
                }

                if (passTimeframe) total += parseFloat(t.amount);
            });
            document.getElementById('lookupResult').innerText = `$${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        async function calculateStats() {
            const { data: transactions } = await supabaseClient.from('transactions').select('*, labels(*)').order('created_at', { ascending: true });
            globalTransactionsCache = transactions || [];
            
            const today = new Date(); today.setHours(0,0,0,0);
            
            const startVal = document.getElementById('trendStart').value;
            const endVal = document.getElementById('trendEnd').value;
            let startDate = startVal ? new Date(startVal) : null;
            let endDate = endVal ? new Date(endVal) : null;
            if (startDate) startDate.setHours(0,0,0,0);
            if (endDate) endDate.setHours(23,59,59,999);

            const savStartVal = document.getElementById('savingsStart').value;
            const savEndVal = document.getElementById('savingsEnd').value;
            let savStartDate = savStartVal ? new Date(savStartVal) : null;
            let savEndDate = savEndVal ? new Date(savEndVal) : null;
            if (savStartDate) savStartDate.setHours(0,0,0,0);
            if (savEndDate) savEndDate.setHours(23,59,59,999);

            let netToday = 0, netMathias = 0, netJulia = 0;
            let futureTotal = 0, savingsPool = 0, runningBal = 0, runningSavingsBal = 0;
            const liquidTimeline = [], savingsTimeline = [];
            const dailyData = {};

            transactions.forEach(t => {
                const amt = parseFloat(t.amount);
                const isInc = t.type === 'income';
                const changeValue = isInc ? amt : -amt;
                const tDate = parseLocal(t.created_at);
                const isFuture = tDate > today;
                const dateKey = tDate.getFullYear() + '-' + String(tDate.getMonth() + 1).padStart(2, '0') + '-' + String(tDate.getDate()).padStart(2, '0');

                if (!dailyData[dateKey]) dailyData[dateKey] = { inc: 0, exp: 0 };
                if (isInc) dailyData[dateKey].inc += amt; else dailyData[dateKey].exp += amt;

                if (t.is_savings) {
                    savingsPool += changeValue;
                    runningSavingsBal += changeValue;

                    let inSavingsRange = true;
                    if (savStartDate && tDate < savStartDate) inSavingsRange = false;
                    if (savEndDate && tDate > savEndDate) inSavingsRange = false;

                    if (inSavingsRange) {
                        savingsTimeline.push({ x: tDate.toLocaleDateString('en-US', {month:'short', day:'numeric'}), y: runningSavingsBal, isFuture });
                    }
                } else {
                    runningBal += changeValue;
                    if (isFuture) {
                        futureTotal += changeValue;
                    } else {
                        netToday += changeValue;
                        if (t.owner === 'Mathias') netMathias += changeValue;
                        if (t.owner === 'Julia') netJulia += changeValue;
                    }

                    let inLiquidRange = true;
                    if (startDate && tDate < startDate) inLiquidRange = false;
                    if (endDate && tDate > endDate) inLiquidRange = false;

                    if (inLiquidRange) {
                        liquidTimeline.push({ x: tDate.toLocaleDateString('en-US', {month:'short', day:'numeric'}), y: runningBal, isFuture });
                    }
                }
            });

            document.getElementById('net-today').innerText = `$${netToday.toLocaleString()}`;
            document.getElementById('net-mathias').innerText = `$${netMathias.toLocaleString()}`;
            document.getElementById('net-julia').innerText = `$${netJulia.toLocaleString()}`;
            document.getElementById('savings-pool').innerText = `$${savingsPool.toLocaleString()}`;
            document.getElementById('future-total').innerText = `$${futureTotal.toLocaleString()}`;
            document.getElementById('prognosis').innerText = `$${(netToday + futureTotal).toLocaleString()}`;

            updateLineChart(liquidTimeline);
            updateSavingsChart(savingsTimeline);
            renderCalendar(dailyData);
            renderFilteredHistory();
            calculateLabelExpense();
        }

        function renderFilteredHistory() {
            const historyBody = document.getElementById('history-body');
            historyBody.innerHTML = '';
            
            const targetLabelFilter = document.getElementById('history_label_filter').value;
            const startVal = document.getElementById('historyStart').value;
            const endVal = document.getElementById('historyEnd').value;
            
            let startDate = startVal ? new Date(startVal) : null;
            let endDate = endVal ? new Date(endVal) : null;
            if (startDate) startDate.setHours(0,0,0,0);
            if (endDate) endDate.setHours(23,59,59,999);

            const today = new Date(); today.setHours(0,0,0,0);

            // Iterate backwards through cached global array to keep chronological visual history stack sequence layout
            for (let i = globalTransactionsCache.length - 1; i >= 0; i--) {
                const t = globalTransactionsCache[i];
                const tDate = parseLocal(t.created_at);
                
                // 1. Check Label constraints
                if (targetLabelFilter !== 'all' && String(t.label_id) !== String(targetLabelFilter)) {
                    continue;
                }
                
                // 2. Check Time Range constraints
                if (startDate && tDate < startDate) continue;
                if (endDate && tDate > endDate) continue;

                const amt = parseFloat(t.amount);
                const isInc = t.type === 'income';
                const isFuture = tDate > today;
                const labelName = t.labels?.name || 'Misc';
                const owner = t.owner || 'Mathias';

                historyBody.insertAdjacentHTML('beforeend', `
                    <tr class="${isFuture ? 'future-row' : ''} ${t.is_savings ? 'savings-row' : ''}">
                        <td class="px-4 py-3 text-[9px] font-black text-slate-400">
                            ${tDate.toLocaleDateString()}<br>
                            ${isFuture ? '<span class="text-indigo-600 font-bold uppercase">[FUTURE]</span>' : '<span>[OK]</span>'}
                        </td>
                        <td class="px-4 py-3 text-left font-black text-xs ${isInc ? 'text-emerald-500' : 'text-rose-500'}">
                            $${amt.toLocaleString()}
                        </td>
                        <td class="px-4 py-3">
                            <div class="font-bold text-slate-800 text-xs">${t.description}</div>
                            <div class="text-[8px] uppercase font-black text-slate-400">${labelName} • <span class="text-slate-600">${owner}</span></div>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <div class="flex items-center justify-end gap-3">
                                ${isFuture ? `<button onclick="confirmTransaction('${t.id}')" class="text-indigo-600 font-black text-[9px]">CONFIRM</button>` : ''}
                                <button onclick="openEditModal('${t.id}')" class="text-slate-400 text-[9px] font-black uppercase">Edit</button>
                                <button onclick="deleteTransaction('${t.id}')" class="text-slate-200 text-lg">×</button>
                            </div>
                        </td>
                    </tr>`);
            }
        }

        function renderCalendar(dailyData) {
            const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
            const now = new Date();
            const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            
            document.getElementById('calendar-month-name').innerText = currentViewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const firstDayOfMonth = new Date(year, month, 1);
            const calStart = new Date(firstDayOfMonth);
            calStart.setDate(calStart.getDate() - firstDayOfMonth.getDay());

            const calBody = document.getElementById('calendar-body');
            const headers = Array.from(calBody.querySelectorAll('.calendar-header'));
            calBody.innerHTML = '';
            headers.forEach(h => calBody.appendChild(h));

            for (let i = 0; i < 42; i++) {
                const dateObj = new Date(calStart);
                dateObj.setDate(dateObj.getDate() + i);
                const dateKey = dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
                const dayIdx = dateObj.getDay();
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day ${dateObj.getMonth() !== month ? 'not-current-month' : ''} ${(dayIdx === 0 || dayIdx === 6) ? 'weekend' : ''} ${dateKey === todayStr ? 'today-border' : ''}`;
                
                let content = `<span class="day-label">${dateObj.getDate()}</span>`;
                if (dailyData[dateKey]) {
                    if (dailyData[dateKey].inc > 0) content += `<span class="cal-income">${Math.round(dailyData[dateKey].inc).toLocaleString()}</span>`;
                    if (dailyData[dateKey].exp > 0) content += `<span class="cal-expense">${Math.round(dailyData[dateKey].exp).toLocaleString()}</span>`;
                }
                dayDiv.innerHTML = content;
                calBody.appendChild(dayDiv);
                if (i >= 34 && dateObj.getMonth() !== month && dayIdx === 6) break;
            }
        }

        function updateLineChart(timeline) {
            if (lineChart) lineChart.destroy();
            if (timeline.length === 0) {
                const ctx = document.getElementById('lineChart').getContext('2d');
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                return;
            }

            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: timeline.map(d => d.x),
                    datasets: [{
                        data: timeline.map(d => d.y),
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: 2,
                        pointHoverRadius: 6,
                        pointBackgroundColor: 'transparent',
                        pointBorderColor: 'transparent',
                        fill: false,
                        segment: {
                            borderColor: ctx => {
                                const y0 = ctx.p0.parsed.y;
                                const y1 = ctx.p1.parsed.y;
                                return y1 >= y0 ? '#10b981' : '#ef4444'; 
                            },
                            borderDash: ctx => timeline[ctx.p1DataIndex]?.isFuture ? [3, 3] : undefined,
                            borderWidth: ctx => timeline[ctx.p1DataIndex]?.isFuture ? 1.5 : 3
                        }
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleFont: { size: 10 },
                            bodyFont: { size: 12, weight: 'bold' },
                            displayColors: false,
                            callbacks: {
                                label: (ctx) => ` Balance: $${ctx.parsed.y.toLocaleString()}`
                            }
                        }
                    },
                    scales: { 
                        x: { ticks: { font: { size: 8 }, maxRotation: 0 }, grid: { display: false } },
                        y: { ticks: { font: { size: 8 } } }
                    },
                    interaction: { mode: 'index', intersect: false }
                }
            });
        }

        function updateSavingsChart(timeline) {
            if (savingsChart) savingsChart.destroy();
            if (timeline.length === 0) {
                const ctx = document.getElementById('savingsChart').getContext('2d');
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                return;
            }

            savingsChart = new Chart(document.getElementById('savingsChart'), {
                type: 'line',
                data: {
                    labels: timeline.map(d => d.x),
                    datasets: [{
                        data: timeline.map(d => d.y),
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: 2,
                        pointHoverRadius: 6,
                        pointBackgroundColor: 'transparent',
                        pointBorderColor: 'transparent',
                        fill: false,
                        segment: {
                            borderColor: ctx => {
                                const y0 = ctx.p0.parsed.y;
                                const y1 = ctx.p1.parsed.y;
                                return y1 >= y0 ? '#0ea5e9' : '#38bdf8'; 
                            },
                            borderDash: ctx => timeline[ctx.p1DataIndex]?.isFuture ? [3, 3] : undefined,
                            borderWidth: ctx => timeline[ctx.p1DataIndex]?.isFuture ? 1.5 : 3
                        }
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: { size: 10 },
                            bodyFont: { size: 12, weight: 'bold' },
                            displayColors: false,
                            callbacks: {
                                label: (ctx) => ` Savings: $${ctx.parsed.y.toLocaleString()}`
                            }
                        }
                    },
                    scales: { 
                        x: { ticks: { font: { size: 8 }, maxRotation: 0 }, grid: { display: false } },
                        y: { ticks: { font: { size: 8 } } }
                    },
                    interaction: { mode: 'index', intersect: false }
                }
            });
        }

        async function deleteTransaction(id) { if (confirm("Delete Transaction?")) { await supabaseClient.from('transactions').delete().eq('id', id); calculateStats(); } }
        init();
    </script>
</body>
</html>
