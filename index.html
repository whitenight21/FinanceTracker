<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Finance Tracker Pro</title>
</head>
<body class="bg-gray-50 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Finance Tracker</h1>
            <div class="flex gap-2">
                <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">v2.0 Live</span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 font-medium">Actual Net (Monthly)</p>
                <h2 id="net-income" class="text-3xl font-bold text-green-600">$0.00</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 font-medium">Savings Pool</p>
                <h2 id="total-savings" class="text-2xl font-bold text-blue-600">$0.00</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 font-medium">1-Year Prognosis</p>
                <h2 id="prognosis" class="text-2xl font-bold text-purple-600">$0.00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Entry Form -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                    <h3 class="font-bold text-lg mb-4">Add Transaction</h3>
                    <div class="space-y-4">
                        <input id="desc" type="text" placeholder="Description" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <input id="amount" type="number" placeholder="Amount" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <select id="type" class="w-full border p-3 rounded-lg bg-white">
                            <option value="income">Income (+)</option>
                            <option value="expense">Expense (-)</option>
                        </select>
                        <select id="label_select" class="w-full border p-3 rounded-lg bg-white"></select>
                        
                        <div class="space-y-2 bg-gray-50 p-3 rounded-lg">
                            <label class="flex items-center gap-2 text-sm cursor-pointer">
                                <input id="is_savings" type="checkbox"> Add to Savings Pool
                            </label>
                            <label class="flex items-center gap-2 text-sm cursor-pointer">
                                <input id="is_recurring" type="checkbox"> Recurring Monthly
                            </label>
                        </div>
                        <button onclick="addTransaction()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">Save Entry</button>
                    </div>
                </div>
            </div>

            <!-- Right: Charts -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                    <h3 class="font-bold text-lg mb-4">Cash Flow Timeline</h3>
                    <div class="h-64"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                    <h3 class="font-bold text-lg mb-4">Expense Breakdown</h3>
                    <div class="h-64"><canvas id="doughnutChart"></canvas></div>
                </div>
            </div>
        </div>

        <!-- Bottom: History Table -->
        <div class="mt-8 bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
            <div class="p-6 border-b border-gray-100">
                <h3 class="font-bold text-lg">Transaction History</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-600 text-sm uppercase">
                        <tr>
                            <th class="px-6 py-4">Date</th>
                            <th class="px-6 py-4">Description</th>
                            <th class="px-6 py-4">Label</th>
                            <th class="px-6 py-4 text-right">Amount</th>
                            <th class="px-6 py-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-body" class="divide-y divide-gray-100">
                        <!-- Table rows generated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'YOUR_SUPABASE_URL';
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let doughnutChart, lineChart;

        async function init() {
            await loadLabels();
            await calculateStats();
        }

        async function loadLabels() {
            const { data: labels } = await supabaseClient.from('labels').select('*').order('name');
            const select = document.getElementById('label_select');
            select.innerHTML = labels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
        }

        async function addTransaction() {
            const description = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const label_id = document.getElementById('label_select').value;
            const is_savings = document.getElementById('is_savings').checked;
            const is_recurring = document.getElementById('is_recurring').checked;

            if (!amount || !label_id) return alert("Missing amount or label");

            const { error } = await supabaseClient.from('transactions').insert([{ 
                description, amount, type, label_id, is_savings, is_recurring 
            }]);

            if (error) alert(error.message);
            else {
                document.getElementById('desc').value = '';
                document.getElementById('amount').value = '';
                init();
            }
        }

        async function deleteTransaction(id) {
            if (!confirm("Delete this entry?")) return;
            await supabaseClient.from('transactions').delete().eq('id', id);
            init();
        }

        async function calculateStats() {
            const { data: transactions } = await supabaseClient.from('transactions').select('*, labels(*)').order('created_at', { ascending: true });

            let net = 0, savings = 0, monthlyRecurring = 0;
            const doughnutData = {};
            const historyBody = document.getElementById('history-body');
            historyBody.innerHTML = '';

            // Line Chart Data
            const timeline = transactions.map(t => ({
                x: new Date(t.created_at).toLocaleDateString(),
                y: t.amount,
                type: t.type
            }));

            transactions.slice().reverse().forEach(t => {
                const val = parseFloat(t.amount);
                const isInc = t.type === 'income';

                // Net/Savings Logic
                if (t.is_savings) savings += val;
                else isInc ? net += val : net -= val;
                
                if (t.is_recurring) isInc ? monthlyRecurring += val : monthlyRecurring -= val;

                // Doughnut Logic (Expenses Only)
                if (!t.is_savings && !isInc) {
                    const labelName = t.labels?.name || 'Unlabeled';
                    doughnutData[labelName] = (doughnutData[labelName] || 0) + val;
                }

                // Build Table
                historyBody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 text-sm text-gray-500">${new Date(t.created_at).toLocaleDateString()}</td>
                        <td class="px-6 py-4 font-medium">${t.description}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 bg-gray-100 rounded text-xs">${t.labels?.name || 'None'}</span></td>
                        <td class="px-6 py-4 text-right font-bold ${isInc ? 'text-green-600' : 'text-red-600'}">${isInc ? '+' : '-'}$${val.toLocaleString()}</td>
                        <td class="px-6 py-4 text-center"><button onclick="deleteTransaction('${t.id}')" class="text-gray-400 hover:text-red-500 text-xl">×</button></td>
                    </tr>`;
            });

            document.getElementById('net-income').innerText = `$${net.toLocaleString()}`;
            document.getElementById('total-savings').innerText = `$${savings.toLocaleString()}`;
            document.getElementById('prognosis').innerText = `$${(net + (monthlyRecurring * 11)).toLocaleString()}`;

            updateCharts(doughnutData, timeline);
        }

        function updateCharts(doughnutData, timeline) {
            // Doughnut Chart
            if (doughnutChart) doughnutChart.destroy();
            doughnutChart = new Chart(document.getElementById('doughnutChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(doughnutData),
                    datasets: [{ data: Object.values(doughnutData), backgroundColor: ['#6366f1','#f59e0b','#ef4444','#10b981','#8b5cf6'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Line Chart (Daily Timeline)
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: timeline.map(d => d.x),
                    datasets: [{
                        label: 'Transaction Amount',
                        data: timeline.map(d => d.y),
                        borderColor: '#e5e7eb',
                        pointBackgroundColor: timeline.map(d => d.type === 'income' ? '#10b981' : '#ef4444'),
                        pointRadius: 6,
                        tension: 0.3
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        init();
    </script>
</body>
</html>
