<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <title>FinanceFlow v6.0</title>
    <style>
        .future-row { background-color: rgba(99, 102, 241, 0.04); border-left: 4px solid #6366f1; }
        .savings-row { background-color: rgba(240, 249, 255, 0.4); }
        .modal { transition: opacity 0.2s ease; visibility: hidden; opacity: 0; }
        .modal.active { visibility: visible; opacity: 1; }
        body.modal-active { overflow: hidden; }
        /* Custom scrollbar for better mobile UX */
        .custom-scrollbar::-webkit-scrollbar { height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Finance<span class="text-indigo-600">Flow</span></h1>
                <p id="header-date" class="text-indigo-500 font-bold text-sm uppercase tracking-widest"></p>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Liquid Net</p>
                <h2 id="net-today" class="text-lg md:text-2xl font-black text-slate-800">$0</h2>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-sky-400 uppercase mb-1">Savings</p>
                <h2 id="savings-pool" class="text-lg md:text-2xl font-black text-sky-600">$0</h2>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-indigo-400 uppercase mb-1">Future</p>
                <h2 id="future-total" class="text-lg md:text-2xl font-black text-indigo-600">$0</h2>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-emerald-400 uppercase mb-1">1-Yr Prognosis</p>
                <h2 id="prognosis" class="text-lg md:text-2xl font-black text-emerald-600">$0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sidebar: Input -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 sticky top-8">
                    <h3 class="font-bold text-lg mb-6 text-slate-800">New Entry</h3>
                    <div class="space-y-4">
                        <input id="date" type="date" class="w-full border-slate-200 border p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input id="desc" type="text" placeholder="Description" class="w-full border-slate-200 border p-3 rounded-xl outline-none">
                        <input id="amount" type="number" placeholder="0.00" class="w-full border-slate-200 border p-3 rounded-xl font-bold outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="type" class="border-slate-200 border p-3 rounded-xl bg-slate-50 font-semibold">
                                <option value="income">Income (+)</option>
                                <option value="expense">Expense (-)</option>
                            </select>
                            <select id="label_select" class="border-slate-200 border p-3 rounded-xl bg-slate-50 font-semibold"></select>
                        </div>
                        <div class="flex items-center gap-2 p-2 bg-slate-50 rounded-xl">
                            <input id="is_savings" type="checkbox" class="w-5 h-5 accent-sky-500">
                            <label for="is_savings" class="text-[10px] font-black text-slate-500 uppercase">Mark as Savings</label>
                        </div>
                        <button onclick="addTransaction()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black shadow-lg transition-transform active:scale-95">Save Entry</button>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-4 text-xs uppercase tracking-widest">Liquid Balance</h3>
                    <div class="h-64"><canvas id="lineChart"></canvas></div>
                </div>
                
                <!-- Table with Mobile Scrolling Fix -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-5 border-b border-slate-50">
                        <h3 class="font-bold text-slate-800 text-sm uppercase">Transaction History</h3>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left min-w-[600px]">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <tr>
                                    <th class="px-6 py-4">Date & Status</th>
                                    <th class="px-6 py-4">Description</th>
                                    <th class="px-6 py-4 text-right">Amount</th>
                                    <th class="px-6 py-4 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="history-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-4 text-xs uppercase tracking-widest">Liquid Distribution</h3>
                    <div id="sankey_chart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl relative">
            <h3 class="text-2xl font-black mb-6">Modify Entry</h3>
            <div class="space-y-4">
                <input id="edit_id" type="hidden">
                <input id="edit_date" type="date" class="w-full border p-3 rounded-xl outline-none">
                <input id="edit_desc" type="text" class="w-full border p-3 rounded-xl outline-none">
                <input id="edit_amount" type="number" class="w-full border p-3 rounded-xl outline-none font-bold">
                <div class="grid grid-cols-2 gap-2">
                    <select id="edit_type" class="border p-3 rounded-xl bg-slate-50">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <select id="edit_label" class="border p-3 rounded-xl bg-slate-50"></select>
                </div>
                <div class="flex items-center gap-2">
                    <input id="edit_savings" type="checkbox" class="w-5 h-5">
                    <label class="text-[10px] font-black uppercase text-slate-500">Savings Entry</label>
                </div>
                <div class="flex gap-2 pt-4">
                    <button onclick="closeEditModal()" class="flex-1 py-3 font-bold text-slate-400">Cancel</button>
                    <button onclick="saveEdit()" class="flex-1 py-3 bg-indigo-600 text-white font-black rounded-xl shadow-lg">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://fgvppxrvheukkhnhyfim.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZndnBweHJ2aGV1a2tobmh5ZmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTUyNDgsImV4cCI6MjA5NDE3MTI0OH0.d4gsgx9bp79pVUw6yp65yyfpBWBmq-w_RICsJ6-S-Tw';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let lineChart;
        google.charts.load('current', {'packages':['sankey']});
        document.getElementById('header-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('date').valueAsDate = new Date();

        async function init() {
            const { data: labels } = await supabaseClient.from('labels').select('*').order('name');
            const labelOptions = labels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            document.getElementById('label_select').innerHTML = labelOptions;
            document.getElementById('edit_label').innerHTML = labelOptions;
            calculateStats();
        }

        async function addTransaction() {
            const payload = {
                description: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                label_id: document.getElementById('label_select').value,
                is_savings: document.getElementById('is_savings').checked,
                created_at: new Date(document.getElementById('date').value).toISOString()
            };
            await supabaseClient.from('transactions').insert([payload]);
            document.getElementById('desc').value = ''; 
            document.getElementById('amount').value = '';
            init();
        }

        async function confirmTransaction(id) {
            await supabaseClient.from('transactions').update({ created_at: new Date().toISOString() }).eq('id', id);
            init();
        }

        async function openEditModal(id) {
            const { data: t } = await supabaseClient.from('transactions').select('*').eq('id', id).single();
            document.getElementById('edit_id').value = t.id;
            document.getElementById('edit_date').value = t.created_at.split('T')[0];
            document.getElementById('edit_desc').value = t.description;
            document.getElementById('edit_amount').value = t.amount;
            document.getElementById('edit_type').value = t.type;
            document.getElementById('edit_label').value = t.label_id;
            document.getElementById('edit_savings').checked = t.is_savings;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }

        async function saveEdit() {
            const id = document.getElementById('edit_id').value;
            const payload = {
                description: document.getElementById('edit_desc').value,
                amount: parseFloat(document.getElementById('edit_amount').value),
                type: document.getElementById('edit_type').value,
                label_id: document.getElementById('edit_label').value,
                is_savings: document.getElementById('edit_savings').checked,
                created_at: new Date(document.getElementById('edit_date').value).toISOString()
            };
            await supabaseClient.from('transactions').update(payload).eq('id', id);
            closeEditModal();
            init();
        }

        async function calculateStats() {
            const { data: transactions } = await supabaseClient.from('transactions').select('*, labels(*)').order('created_at', { ascending: true });
            const now = new Date(); now.setHours(0,0,0,0);

            let netToday = 0, futureTotal = 0, savingsPool = 0, runningBal = 0, totalLiquidIncome = 0;
            const timeline = [], sankeyRows = [], historyBody = document.getElementById('history-body');
            historyBody.innerHTML = '';

            transactions.forEach(t => {
                const amt = parseFloat(t.amount);
                const isInc = t.type === 'income';
                const tDate = new Date(t.created_at);
                const isFuture = tDate > now;
                const label = t.labels?.name || 'Unlabeled';

                if (t.is_savings) {
                    savingsPool += (isInc ? amt : -amt);
                } else {
                    isInc ? runningBal += amt : runningBal -= amt;
                    if (isFuture) { futureTotal += (isInc ? amt : -amt); } 
                    else { isInc ? netToday += amt : netToday -= amt; }
                    if (isInc) totalLiquidIncome += amt;
                    else sankeyRows.push(['Active Income', label, amt]);
                    timeline.push({ x: tDate.toLocaleDateString(), y: runningBal, isFuture });
                }

                historyBody.insertAdjacentHTML('afterbegin', `
                    <tr class="${isFuture ? 'future-row' : ''} ${t.is_savings ? 'savings-row' : ''}">
                        <td class="px-6 py-4">
                            <span class="text-[10px] font-black text-slate-400">${tDate.toLocaleDateString()}</span><br>
                            ${isFuture ? '<span class="text-[8px] text-indigo-600 font-black">[FUTURE]</span>' : ''}
                            ${t.is_savings ? '<span class="text-[8px] text-sky-500 font-black">[SAVINGS]</span>' : ''}
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800 text-sm">${t.description}</div>
                            <div class="text-[9px] uppercase font-black text-slate-400">${label}</div>
                        </td>
                        <td class="px-6 py-4 text-right font-black ${isInc ? 'text-emerald-500' : 'text-rose-500'}">
                            ${isInc ? '+' : '-'}$${amt.toLocaleString()}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex items-center justify-center gap-2">
                                ${isFuture ? `<button onclick="confirmTransaction('${t.id}')" class="text-indigo-600 font-black text-[9px] bg-indigo-50 px-2 py-1 rounded border border-indigo-100">CONFIRM</button>` : ''}
                                <button onclick="openEditModal('${t.id}')" class="text-slate-400 hover:text-slate-800 text-[9px] font-black uppercase">Edit</button>
                                <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-500 text-xl">×</button>
                            </div>
                        </td>
                    </tr>`);
            });

            const liquidSpent = sankeyRows.reduce((a, b) => a + b[2], 0);
            if (totalLiquidIncome > liquidSpent) sankeyRows.push(['Active Income', 'Net Remaining', totalLiquidIncome - liquidSpent]);

            document.getElementById('net-today').innerText = `$${netToday.toLocaleString()}`;
            document.getElementById('savings-pool').innerText = `$${savingsPool.toLocaleString()}`;
            document.getElementById('future-total').innerText = `$${futureTotal.toLocaleString()}`;
            document.getElementById('prognosis').innerText = `$${(netToday + (netToday * 0.15)).toLocaleString()}`;

            updateLineChart(timeline);
            drawSankey(sankeyRows);
        }

        function updateLineChart(timeline) {
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: timeline.map(d => d.x),
                    datasets: [{
                        label: 'Balance',
                        data: timeline.map(d => d.y),
                        borderColor: '#6366f1',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 0,
                        segment: { borderDash: ctx => timeline[ctx.p1DataIndex]?.isFuture ? [5, 5] : undefined }
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false } } }
            });
        }

        function drawSankey(rows) {
            if (rows.length === 0) return;
            const data = new google.visualization.DataTable();
            data.addColumn('string', 'From'); data.addColumn('string', 'To'); data.addColumn('number', 'Amount');
            data.addRows(rows);
            new google.visualization.Sankey(document.getElementById('sankey_chart')).draw(data, {
                sankey: { node: { colors: ['#1e293b', '#6366f1', '#10b981', '#f59e0b', '#ef4444'], label: { fontSize: 10, bold: true } } }
            });
        }

        async function deleteTransaction(id) { if (confirm("Delete this?")) { await supabaseClient.from('transactions').delete().eq('id', id); init(); } }
        google.charts.setOnLoadCallback(init);
    </script>
</body>
</html>
