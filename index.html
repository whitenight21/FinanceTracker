<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <title>FinanceFlow v5.2</title>
    <style>
        .future-row { background-color: rgba(99, 102, 241, 0.03); border-left: 4px solid #6366f1; }
        .modal { transition: opacity 0.2s ease; }
        body.modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header with Current Date -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Finance<span class="text-indigo-600">Flow</span></h1>
                <p id="header-date" class="text-indigo-500 font-bold text-sm uppercase tracking-widest"></p>
            </div>
            <div class="bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-200 text-xs font-bold text-slate-500">
                DB STATUS: <span class="text-green-500">CONNECTED</span>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-xs font-black text-slate-400 uppercase">Current Net Balance</p>
                <h2 id="net-today" class="text-3xl font-black text-slate-800">$0.00</h2>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-xs font-black text-indigo-400 uppercase">Future Commitments</p>
                <h2 id="future-total" class="text-3xl font-black text-indigo-600">$0.00</h2>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-xs font-black text-emerald-400 uppercase">12-Month Prognosis</p>
                <h2 id="prognosis" class="text-3xl font-black text-emerald-600">$0.00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sidebar: Input Form -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 sticky top-8">
                    <h3 class="font-bold text-lg mb-6">New Transaction</h3>
                    <div class="space-y-4">
                        <input id="date" type="date" class="w-full border-slate-200 border p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input id="desc" type="text" placeholder="Description" class="w-full border-slate-200 border p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input id="amount" type="number" placeholder="0.00" class="w-full border-slate-200 border p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="type" class="border-slate-200 border p-3 rounded-xl bg-slate-50 font-semibold">
                                <option value="income">Income (+)</option>
                                <option value="expense">Expense (-)</option>
                            </select>
                            <select id="label_select" class="border-slate-200 border p-3 rounded-xl bg-slate-50 font-semibold"></select>
                        </div>
                        <button onclick="addTransaction()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black transition-transform active:scale-95 shadow-lg">Save Entry</button>
                    </div>
                </div>
            </div>

            <!-- Main Content: Charts & History -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Charts -->
                <div class="grid grid-cols-1 gap-8">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-4">Projected Timeline</h3>
                        <div class="h-64"><canvas id="lineChart"></canvas></div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-4">Flow Distribution (All Data)</h3>
                        <div id="sankey_chart" style="height: 300px;"></div>
                    </div>
                </div>

                <!-- History Table -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">Transaction Log</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <tr>
                                    <th class="px-6 py-4">Date</th>
                                    <th class="px-6 py-4">Entry</th>
                                    <th class="px-6 py-4 text-right">Amount</th>
                                    <th class="px-6 py-4 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://fgvppxrvheukkhnhyfim.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZndnBweHJ2aGV1a2tobmh5ZmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTUyNDgsImV4cCI6MjA5NDE3MTI0OH0.d4gsgx9bp79pVUw6yp65yyfpBWBmq-w_RICsJ6-S-Tw';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let lineChart;
        google.charts.load('current', {'packages':['sankey']});

        // Set Current Date
        const todayStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('header-date').innerText = todayStr;
        document.getElementById('date').valueAsDate = new Date();

        async function init() {
            try {
                await loadLabels();
                await calculateStats();
            } catch (err) {
                console.error("Initialization Failed:", err);
            }
        }

        async function loadLabels() {
            const { data: labels } = await supabaseClient.from('labels').select('*').order('name');
            const options = labels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            document.getElementById('label_select').innerHTML = options;
        }

        async function addTransaction() {
            const payload = {
                description: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                label_id: document.getElementById('label_select').value,
                created_at: new Date(document.getElementById('date').value).toISOString()
            };
            const { error } = await supabaseClient.from('transactions').insert([payload]);
            if (!error) { 
                document.getElementById('desc').value = ''; 
                document.getElementById('amount').value = ''; 
                init(); 
            }
        }

        async function confirmTransaction(id) {
            const { error } = await supabaseClient.from('transactions').update({ created_at: new Date().toISOString() }).eq('id', id);
            if (!error) init();
        }

        async function calculateStats() {
            const { data: transactions, error } = await supabaseClient.from('transactions').select('*, labels(*)').order('created_at', { ascending: true });
            if (error) throw error;

            const now = new Date();
            now.setHours(0,0,0,0);

            let netToday = 0, futureTotal = 0, runningBal = 0, totalIncome = 0;
            const timeline = [], sankeyRows = [], historyBody = document.getElementById('history-body');
            historyBody.innerHTML = '';

            transactions.forEach(t => {
                const amt = parseFloat(t.amount);
                const isInc = t.type === 'income';
                const tDate = new Date(t.created_at);
                const isFuture = tDate > now;
                const label = t.labels?.name || 'General';

                // Running Balance (Includes future for timeline)
                isInc ? runningBal += amt : runningBal -= amt;
                
                if (isFuture) {
                    futureTotal += amt;
                } else {
                    isInc ? netToday += amt : netToday -= amt;
                }

                if (isInc) totalIncome += amt;
                else sankeyRows.push(['Income Flow', label, amt]);

                timeline.push({ x: tDate.toLocaleDateString(), y: runningBal, isFuture });
            });

            // Sankey Remainder
            const totalSpent = sankeyRows.reduce((a, b) => a + b[2], 0);
            if (totalIncome > totalSpent) sankeyRows.push(['Income Flow', 'Remaining Balance', totalIncome - totalSpent]);

            // Render Table (Latest First)
            transactions.slice().reverse().forEach(t => {
                const isInc = t.type === 'income';
                const isFuture = new Date(t.created_at) > now;
                historyBody.innerHTML += `
                    <tr class="${isFuture ? 'future-row' : ''}">
                        <td class="px-6 py-4 text-[10px] font-bold text-slate-400">
                            ${new Date(t.created_at).toLocaleDateString()}<br>
                            ${isFuture ? '<span class="text-indigo-600 font-black tracking-tighter">[FUTURE]</span>' : ''}
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800">${t.description}</div>
                            <div class="text-[9px] uppercase font-black text-slate-400">${t.labels?.name || ''}</div>
                        </td>
                        <td class="px-6 py-4 text-right font-black ${isInc ? 'text-emerald-500' : 'text-rose-500'}">
                            ${isInc ? '+' : '-'}$${t.amount.toLocaleString()}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex justify-center gap-2">
                                ${isFuture ? `<button onclick="confirmTransaction('${t.id}')" class="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded-md font-bold shadow-md">CONFIRM</button>` : ''}
                                <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-500 text-lg">×</button>
                            </div>
                        </td>
                    </tr>`;
            });

            document.getElementById('net-today').innerText = `$${netToday.toLocaleString()}`;
            document.getElementById('future-total').innerText = `$${futureTotal.toLocaleString()}`;
            document.getElementById('prognosis').innerText = `$${(netToday + (netToday * 0.1)).toLocaleString()}`; // Simplified forecast

            updateLineChart(timeline);
            drawSankey(sankeyRows);
        }

        function drawSankey(rows) {
            if (rows.length === 0) return;
            const data = new google.visualization.DataTable();
            data.addColumn('string', 'From');
            data.addColumn('string', 'To');
            data.addColumn('number', 'Amount');
            data.addRows(rows);
            const chart = new google.visualization.Sankey(document.getElementById('sankey_chart'));
            chart.draw(data, { sankey: { node: { colors: ['#0f172a', '#6366f1', '#10b981'], label: { fontSize: 10, bold: true } } } });
        }

        function updateLineChart(timeline) {
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: timeline.map(d => d.x),
                    datasets: [{
                        label: 'Running Balance',
                        data: timeline.map(d => d.y),
                        borderColor: '#6366f1',
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: 2,
                        segment: { borderDash: ctx => timeline[ctx.p1DataIndex]?.isFuture ? [5, 5] : undefined }
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function deleteTransaction(id) {
            if (confirm("Delete this entry?")) {
                await supabaseClient.from('transactions').delete().eq('id', id);
                init();
            }
        }

        google.charts.setOnLoadCallback(init);
    </script>
</body>
</html>
