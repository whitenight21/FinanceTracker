<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <title>FinanceFlow v5.5</title>
    <style>
        .future-row { background-color: rgba(99, 102, 241, 0.03); border-left: 4px solid #6366f1; }
        .savings-row { background-color: rgba(240, 249, 255, 0.4); }
        body.modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Finance<span class="text-indigo-600">Flow</span></h1>
                <p id="header-date" class="text-indigo-500 font-bold text-sm uppercase tracking-widest"></p>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase">Liquid Net Balance</p>
                <h2 id="net-today" class="text-2xl font-black text-slate-800">$0.00</h2>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-sky-400 uppercase">Savings Pool (Isolated)</p>
                <h2 id="savings-pool" class="text-2xl font-black text-sky-600">$0.00</h2>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-indigo-400 uppercase">Future Liquid Commits</p>
                <h2 id="future-total" class="text-2xl font-black text-indigo-600">$0.00</h2>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-emerald-400 uppercase">1-Yr Liquid Prognosis</p>
                <h2 id="prognosis" class="text-2xl font-black text-emerald-600">$0.00</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 sticky top-8">
                    <h3 class="font-bold text-lg mb-6 text-slate-800">New Entry</h3>
                    <div class="space-y-4">
                        <input id="date" type="date" class="w-full border-slate-200 border p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input id="desc" type="text" placeholder="Description" class="w-full border-slate-200 border p-3 rounded-xl outline-none">
                        <input id="amount" type="number" placeholder="0.00" class="w-full border-slate-200 border p-3 rounded-xl font-bold outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="type" class="border-slate-200 border p-3 rounded-xl bg-slate-50 font-semibold">
                                <option value="income">Income (+)</option>
                                <option value="expense">Expense (-)</option>
                            </select>
                            <select id="label_select" class="border-slate-200 border p-3 rounded-xl bg-slate-50 font-semibold"></select>
                        </div>
                        <div class="flex items-center gap-2 p-2 bg-slate-50 rounded-xl">
                            <input id="is_savings" type="checkbox" class="w-5 h-5 accent-sky-500">
                            <label for="is_savings" class="text-xs font-bold text-slate-500 uppercase">Mark as Savings (Hidden from Flow)</label>
                        </div>
                        <button onclick="addTransaction()" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black shadow-lg">Save Transaction</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase">Liquid Balance Timeline (Excludes Savings)</h3>
                    <div class="h-64"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase">Liquid Flow Distribution</h3>
                    <div id="sankey_chart" style="height: 300px;"></div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <tr>
                                    <th class="px-6 py-4">Date</th>
                                    <th class="px-6 py-4">Entry</th>
                                    <th class="px-6 py-4 text-right">Amount</th>
                                    <th class="px-6 py-4 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://fgvppxrvheukkhnhyfim.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZndnBweHJ2aGV1a2tobmh5ZmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1OTUyNDgsImV4cCI6MjA5NDE3MTI0OH0.d4gsgx9bp79pVUw6yp65yyfpBWBmq-w_RICsJ6-S-Tw';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let lineChart;
        google.charts.load('current', {'packages':['sankey']});
        document.getElementById('header-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('date').valueAsDate = new Date();

        async function init() {
            const { data: labels } = await supabaseClient.from('labels').select('*').order('name');
            document.getElementById('label_select').innerHTML = labels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
            calculateStats();
        }

        async function addTransaction() {
            const payload = {
                description: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                type: document.getElementById('type').value,
                label_id: document.getElementById('label_select').value,
                is_savings: document.getElementById('is_savings').checked,
                created_at: new Date(document.getElementById('date').value).toISOString()
            };
            await supabaseClient.from('transactions').insert([payload]);
            document.getElementById('desc').value = ''; 
            document.getElementById('amount').value = '';
            document.getElementById('is_savings').checked = false;
            init();
        }

        async function confirmTransaction(id) {
            await supabaseClient.from('transactions').update({ created_at: new Date().toISOString() }).eq('id', id);
            init();
        }

        async function calculateStats() {
            const { data: transactions } = await supabaseClient.from('transactions').select('*, labels(*)').order('created_at', { ascending: true });
            const now = new Date(); now.setHours(0,0,0,0);

            let netToday = 0, futureTotal = 0, savingsPool = 0, runningBal = 0, totalLiquidIncome = 0;
            const timeline = [], sankeyRows = [], historyBody = document.getElementById('history-body');
            historyBody.innerHTML = '';

            transactions.forEach(t => {
                const amt = parseFloat(t.amount);
                const isInc = t.type === 'income';
                const tDate = new Date(t.created_at);
                const isFuture = tDate > now;
                const label = t.labels?.name || 'General';

                if (t.is_savings) {
                    savingsPool += (isInc ? amt : -amt);
                } else {
                    // Logic for Timeline & Sankey (Pure Liquid)
                    isInc ? runningBal += amt : runningBal -= amt;
                    
                    if (isFuture) { futureTotal += amt; } 
                    else { isInc ? netToday += amt : netToday -= amt; }

                    if (isInc) {
                        totalLiquidIncome += amt;
                    } else {
                        sankeyRows.push(['Active Income', label, amt]);
                    }
                    timeline.push({ x: tDate.toLocaleDateString(), y: runningBal, isFuture });
                }

                // Table Logic (Shows everything)
                historyBody.insertAdjacentHTML('afterbegin', `
                    <tr class="${isFuture ? 'future-row' : ''} ${t.is_savings ? 'savings-row' : ''}">
                        <td class="px-6 py-4 text-[10px] font-bold text-slate-400">
                            ${tDate.toLocaleDateString()}<br>
                            ${isFuture ? '<span class="text-indigo-600 font-black">[FUTURE]</span>' : ''}
                            ${t.is_savings ? '<span class="text-sky-500 font-black">[SAVINGS]</span>' : ''}
                        </td>
                        <td class="px-6 py-4">
                            <div class="font-bold text-slate-800">${t.description}</div>
                            <div class="text-[9px] uppercase font-black text-slate-400">${label}</div>
                        </td>
                        <td class="px-6 py-4 text-right font-black ${isInc ? 'text-emerald-500' : 'text-rose-500'}">
                            ${isInc ? '+' : '-'}$${amt.toLocaleString()}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <div class="flex justify-center gap-2">
                                ${isFuture ? `<button onclick="confirmTransaction('${t.id}')" class="bg-indigo-600 text-white text-[10px] px-2 py-1 rounded-md font-bold">CONFIRM</button>` : ''}
                                <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-500 text-lg">×</button>
                            </div>
                        </td>
                    </tr>`);
            });

            // Sankey Remaining
            const liquidSpent = sankeyRows.reduce((a, b) => a + b[2], 0);
            if (totalLiquidIncome > liquidSpent) sankeyRows.push(['Active Income', 'Net Remaining', totalLiquidIncome - liquidSpent]);

            document.getElementById('net-today').innerText = `$${netToday.toLocaleString()}`;
            document.getElementById('savings-pool').innerText = `$${savingsPool.toLocaleString()}`;
            document.getElementById('future-total').innerText = `$${futureTotal.toLocaleString()}`;
            document.getElementById('prognosis').innerText = `$${(netToday + (netToday * 0.15)).toLocaleString()}`;

            updateLineChart(timeline);
            drawSankey(sankeyRows);
        }

        function drawSankey(rows) {
            if (rows.length === 0) return;
            const data = new google.visualization.DataTable();
            data.addColumn('string', 'From'); data.addColumn('string', 'To'); data.addColumn('number', 'Amount');
            data.addRows(rows);
            new google.visualization.Sankey(document.getElementById('sankey_chart')).draw(data, {
                sankey: { node: { colors: ['#1e293b', '#6366f1', '#10b981', '#f59e0b', '#ef4444'], label: { fontSize: 10, bold: true } } }
            });
        }

        function updateLineChart(timeline) {
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: timeline.map(d => d.x),
                    datasets: [{
                        label: 'Liquid Balance',
                        data: timeline.map(d => d.y),
                        borderColor: '#6366f1',
                        borderWidth: 3,
                        tension: 0.3,
                        pointRadius: 2,
                        segment: { borderDash: ctx => timeline[ctx.p1DataIndex]?.isFuture ? [5, 5] : undefined }
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function deleteTransaction(id) { if (confirm("Delete?")) { await supabaseClient.from('transactions').delete().eq('id', id); init(); } }
        google.charts.setOnLoadCallback(init);
    </script>
</body>
</html>
